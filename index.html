<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Straw Hat Samurai Duels — Local Solo</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b12;height:100%;overflow:hidden;
            font-family:system-ui,-apple-system,sans-serif;color:#eee}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #game{width:900px;height:776px;max-width:100vw;max-height:100vh}
  #hint{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.5;z-index:9}
  code{background:#1b1b26;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="hint">Local solo build · Ruffle 0.7.1 · patched SWF · local PHP backend</div>

<script src="ruffle.js"></script>
<script>
(function () {
  function boot() {
    var RP = window.RufflePlayer;
    var mod = RP && RP.sources && RP.sources.local;
    if (!mod || !mod.createPlayer) {
      document.getElementById('hint').textContent = 'Ruffle module failed to load.';
      return;
    }
    var el = mod.createPlayer();
    el.config = {
      autoplay: 'on',
      unmuteOverlay: 'hidden',
      allowScriptAccess: true,
      playerId: 'local-solo',
      gameId: 'straw-hat-samurai-duels-5nsekxalfuoiuqdxrmtxw',
      // The patched SWF points its PHP base at playerio.localhost:8765/solo/server/
      url: location.origin + '/shs3_solo.swf',
      autostart: true,
      allowExternalHttp: true,
    };
    document.getElementById('game').appendChild(el);
    window.__game = el;
  }
  if (window.RufflePlayer) boot();
  else window.addEventListener('load', boot);
})();
</script>
</body>
</html>
